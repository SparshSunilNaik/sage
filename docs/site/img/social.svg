<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="SAGE: plan, run, verify and audit coding agents on top of OpenCode">
  <rect width="1200" height="630" fill="#f6f4ee"/>
  <rect x="0" y="0" width="1200" height="8" fill="#a63a10"/>
  <g font-family="Cascadia Mono, Consolas, Menlo, monospace">
    <rect x="72" y="72" width="64" height="64" rx="8" fill="#1b1a17"/>
    <path d="M90 92 L104 104 L90 116" fill="none" stroke="#f6f4ee" stroke-width="5"/>
    <rect x="109" y="111" width="17" height="5.5" fill="#e2703f"/>
    <text x="156" y="118" font-size="34" font-weight="700" letter-spacing="4" fill="#1b1a17">SAGE</text>
    <text x="72" y="194" font-size="20" letter-spacing="2" fill="#a63a10">CONTROL PLANE FOR CODING AGENTS · BUILT ON OPENCODE</text>
  </g>
  <g font-family="Charter, Cambria, Georgia, serif" fill="#1b1a17">
    <text x="72" y="268" font-size="54" font-weight="600">Give an agent a goal.</text>
    <text x="72" y="334" font-size="54" font-weight="600">Get back verified, reviewable commits.</text>
  </g>
  <g font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="20" fill="#4b473f">
    <text x="72" y="404">crash-safe journal · policy on every tool call</text>
    <text x="72" y="436">verification the model cannot grade · human approval before merge</text>
  </g>
  <rect x="72" y="478" width="1056" height="96" rx="8" fill="#1c1b18"/>
  <g font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="19">
    <text x="98" y="518"><tspan fill="#8fb8de">$</tspan><tspan fill="#e9e5da"> sage run "add multiply and subtract to src/math.ts" --yes</tspan></text>
    <text x="98" y="552" fill="#a8a194">   │  └─ gate test: <tspan fill="#a5d394">pass</tspan> — 3 pass, 0 fail</text>
  </g>
</svg>
