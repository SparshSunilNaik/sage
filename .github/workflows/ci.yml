name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        # The OpenCode fork submodule is not needed for the test suite (fake engine only).
        with:
          submodules: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Configure git for test fixture repos
        # Tests create throwaway git repos and commit to them. Ephemeral CI runners have no git identity;
        # this sets one for the runner only. Nothing created here is pushed anywhere.
        run: |
          git config --global user.name "sage-ci"
          git config --global user.email "sage-ci@users.noreply.github.com"
          git config --global core.longpaths true
          git config --global init.defaultBranch main
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
